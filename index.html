<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎈 HOW MANY LIKES UNTIL IT POPS? 🎈</title>

<style>

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #30104a, #09000f 75%);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: 34px;
    margin: 30px 10px 5px;
}

.instruction {
    font-size: 22px;
    font-weight: bold;
    margin-top: 8px;
}

/* BALLOON AREA */

.stage {
    height: 500px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* BALLOON */

.balloon {
    width: 300px;
    height: 385px;

    background:
        radial-gradient(
            circle at 32% 23%,
            #ffffff 0%,
            #ffb3b3 7%,
            #ff4040 25%,
            #e00000 60%,
            #780000 100%
        );

    border-radius: 50% 50% 47% 47%;

    box-shadow:
        0 0 35px rgba(255,0,0,.55),
        0 0 90px rgba(255,0,0,.25);

    position: relative;

    transform-origin: center bottom;
}

/* BALLOON KNOT */

.balloon::after {
    content: "";
    position: absolute;

    bottom: -25px;
    left: 135px;

    width: 0;
    height: 0;

    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 30px solid #9d0000;
}

/* POP FLASH */

.flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
}

/* WINNER MESSAGE */

.winner {
    position: fixed;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%) scale(0);

    width: 90%;

    font-size: 72px;
    font-weight: bold;

    text-shadow:
        0 0 15px white,
        0 0 35px gold;

    z-index: 10;
}

/* CONFETTI */

.confetti {
    position: fixed;
    top: -30px;

    width: 14px;
    height: 22px;

    z-index: 9;

    animation: fall 4s linear forwards;
}

@keyframes fall {

    to {
        transform:
            translateY(110vh)
            rotate(900deg);
    }
}

</style>
</head>


<body>

<h1>🎈 🎈 HOW MANY LIKES UNTIL IT POPS? 🎈 🎈</h1>
    ❤️ LIKE TO ADD PRESSURE! ❤️

<div class="instruction">
    👀 GUESS THE SURPRISE! 👀
</div>
    
<div id="liveStatus">🔴 LIVE • 00:00:00</div>

<div class="stage">

    <div class="balloon" id="balloon"></div>

</div>

<div class="flash" id="flash"></div>

<div class="winner" id="winner">
    🎉 YOU DID IT! 🎉
</div>


<script>

const balloon = document.getElementById("balloon");
const squeak = new Audio("freesound_community-plastic-squeak8-103385.mp3");
squeak.volume = 0.8;
const backgroundMusic = new Audio("music-for-videos-tension-game-strange-music-160495.mp3");
backgroundMusic.loop = true;
backgroundMusic.volume = 0.18;   

let squeakPlayed = false;

let time = 0;


/* -----------------------
   BALLOON SUSPENSE
----------------------- */

function animateBalloon() {

    time += 0.015;

    /* gentle breathing */
    let pulse =
        1 + Math.sin(time) * 0.018;

    /* tiny natural wobble */
    let wobble =
        Math.sin(time * 1.7) * 2;

    /*
       Every so often the balloon
       suddenly looks VERY close
       to popping.
    */

    let danger =
        Math.max(
            0,
            Math.sin(time * 0.23)
        );

    danger = Math.pow(danger, 12);

    let dangerSize =
        danger * 0.09;

    let dangerShake =
        danger *
        Math.sin(time * 35) *
        5;
    if (danger > 0.55 && !squeakPlayed) {
    squeak.currentTime = 0;
    squeak.play();
    squeakPlayed = true;
}

if (danger < 0.15) {
    squeakPlayed = false;
}

    balloon.style.transform =
        `scale(${pulse + dangerSize})
         rotate(${wobble + dangerShake}deg)`;

    requestAnimationFrame(animateBalloon);
}

animateBalloon();


/* -----------------------
   CONFETTI
----------------------- */

function makeConfetti() {

    const colors = [
        "#ff0000",
        "#ffd700",
        "#00ff88",
        "#00aaff",
        "#ff44cc",
        "#ffffff"
    ];

    for (let i = 0; i < 150; i++) {

        const piece =
            document.createElement("div");

        piece.className = "confetti";

        piece.style.left =
            Math.random() * 100 + "vw";

        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors. length
                )
            ];

        piece.style.animationDelay =
            Math.random() * 1.5 + "s";

        document.body.appendChild(piece);

        setTimeout(() => {
            piece.remove();
        }, 6000);
    }
}


/* -----------------------
   POP FUNCTION
   (We'll connect this later)
----------------------- */

function popBalloon() {

    const flash =
        document.getElementById("flash");

    const winner =
        document.getElementById("winner");

    balloon.style.display = "none";

    flash.style.opacity = "1";

    setTimeout(() => {
        flash.style.opacity = "0";
    }, 120);

    winner.style.transform =
        "translate(-50%, -50%) scale(1)";

    makeConfetti();
}
const liveStatus = document.getElementById("liveStatus");
let liveSeconds = 0;

setInterval(() => {
    liveSeconds++;

    const hours = Math.floor(liveSeconds / 3600);
    const minutes = Math.floor((liveSeconds % 3600) / 60);
    const seconds = liveSeconds % 60;

    liveStatus.textContent =
        "🔴 LIVE • " +
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

}, 1000);
document.addEventListener("click", () => {
    if (backgroundMusic.paused) {
        backgroundMusic.play();
    }
}, { once: true });    
</script>

</body>
</html>
